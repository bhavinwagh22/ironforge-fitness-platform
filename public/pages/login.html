<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iron Forge Gym — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/gym-landing.css" />
<style>
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 100px 6vw 60px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,59,48,.18), transparent 45%),
      radial-gradient(circle at 70% 80%, rgba(255,149,0,.12), transparent 45%),
      var(--bg);
    position: relative; overflow: hidden;
  }
  .login-wrap::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  .login-card {
    position: relative; z-index: 2; width: 100%; max-width: 420px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 40px 36px; box-shadow: 0 30px 60px rgba(0,0,0,.5);
    animation: fadeUp .8s forwards;
  }
  .login-card .logo { display: block; text-align: center; margin-bottom: 8px; }
  .login-card .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; letter-spacing: .5px; }
  .field input {
    width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text); font-size: 15px; font-family: inherit;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,59,48,.15); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; }
  .row label { color: var(--muted); display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .row a { color: var(--accent); text-decoration: none; }
  .row a:hover { text-decoration: underline; }
  .login-btn {
    width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,59,48,.5); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--muted); font-size: 13px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .social { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .social button {
    padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer;
    transition: border-color .2s, transform .2s;
  }
  .social button:hover { border-color: var(--text); transform: translateY(-2px); }
  .signup { text-align: center; margin-top: 24px; color: var(--muted); font-size: 14px; }
  .signup a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .signup a:hover { text-decoration: underline; }
  .back { position: absolute; top: 24px; left: 24px; z-index: 3; color: var(--muted); text-decoration: none; font-size: 14px; }
  .back:hover { color: var(--accent); }
</style>
</head>
<body>
  <a class="back" href="/pages/gym-landing.html">← Back to home</a>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">IRON<span>FORGE</span></div>
      <div class="sub">Sign in to your account</div>
      <form id="loginForm">
        <div class="field" id="nameField" style="display:none;">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="John Doe" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <div class="row">
          <label><input type="checkbox" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="login-btn">Sign In</button>
        <p id="msg" style="margin-top:14px; font-size:14px; text-align:center;"></p>
      </form>
      <div class="signup">New here? <a href="#" id="registerLink">Create an account</a></div>
      <script src="/js/login.js"></script>
      <div class="divider">or continue with</div>
      <div class="social">
        <button id="googleBtn" type="button">Google</button>
        <button type="button">Apple</button>
      </div>
      <div class="signup">New here? <a href="#">Create an account</a></div>
    </div>
  </div>
</body>
</html>
